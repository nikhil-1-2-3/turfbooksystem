services:
  # Backend Node.js Service
  - type: web
    name: turf-booking-backend
    env: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    envVars:
      - key: PORT
        value: 4050
      - key: ATLASDB_URL
        sync: false # You will need to add your MongoDB URL securely in the Render Dashboard
      - key: JWT_SECRET
        sync: false # Add this in Render Dashboard
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false

  # Frontend Vite React App
  - type: web
    name: turf-booking-frontend
    env: docker
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    envVars:
      # The URL where your backend will be accessible on Render
      - key: VITE_BASE_URL
        value: https://turf-booking-backend.onrender.com/api/v1
