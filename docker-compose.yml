version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4050:4050"
    env_file:
      - ./server/.env
    # Only uncomment depends_on if you are adding a mongodb container here
    # depends_on:
    #   - mongodb
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    # Wait for the backend to be ready
    depends_on:
      - server
    restart: unless-stopped

